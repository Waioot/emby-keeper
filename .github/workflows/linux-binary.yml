name: Linux Binary Release

on:
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build CLI binary
        run: |
          pyinstaller cli.py \
            --name embykeeper-linux-amd64 \
            --onefile \
            --clean \
            --noconfirm \
            --paths . \
            --collect-submodules embykeeper \
            --collect-submodules embykeeperweb \
            --collect-data embykeeper \
            --collect-all embykeeperweb

      - name: Build Web binary
        run: |
          pyinstaller web.py \
            --name embykeeper-web-linux-amd64 \
            --onefile \
            --clean \
            --noconfirm \
            --paths . \
            --collect-submodules embykeeper \
            --collect-submodules embykeeperweb \
            --collect-data embykeeper \
            --collect-all embykeeperweb

      - name: Generate checksums
        run: |
          cd dist
          sha256sum embykeeper-linux-amd64 embykeeper-web-linux-amd64 > SHA256SUMS

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary-amd64
          path: |
            dist/embykeeper-linux-amd64
            dist/embykeeper-web-linux-amd64
            dist/SHA256SUMS

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            dist/embykeeper-linux-amd64 \
            dist/embykeeper-web-linux-amd64 \
            dist/SHA256SUMS \
            --repo ${{ github.repository }}
